name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Validate project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.sydmahadi \
            --project-name amar_hisab \
            .

      - name: Configure Android Gradle versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
          ]

          settings = next(
              (p for p in candidates if p.exists()),
              None
          )

          if settings is None:
              raise SystemExit("ERROR: settings.gradle not found")

          content = settings.read_text()

          content, agp_count = re.subn(
              r'(id\(["\']com\.android\.application["\']\)'
              r'\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"8.13.0"',
              content,
              count=1
          )

          content, kotlin_count = re.subn(
              r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)'
              r'\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"2.2.20"',
              content,
              count=1
          )

          if agp_count != 1:
              raise SystemExit("ERROR: Could not configure AGP")

          if kotlin_count != 1:
              raise SystemExit("ERROR: Could not configure Kotlin")

          settings.write_text(content)

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          wrapper_content = wrapper.read_text()

          wrapper_content, count = re.subn(
              r'(?m)^distributionUrl=.*$',
              lambda m: (
                  'distributionUrl=https\\://services.gradle.org/'
                  'distributions/gradle-8.14.3-bin.zip'
              ),
              wrapper_content,
              count=1
          )

          if count != 1:
              raise SystemExit("ERROR: Could not configure Gradle")

          wrapper.write_text(wrapper_content)

          print("Android Gradle versions configured.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Android app Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle is None:
              raise SystemExit("ERROR: App Gradle file not found")

          content = gradle.read_text()
          is_kts = gradle.name.endswith(".kts")

          if is_kts:
              content, count = re.subn(
                  r'(?m)^(\s*compileSdk\s*=\s*).*$',
                  r'\g<1>36',
                  content,
                  count=1
              )
          else:
              content, count = re.subn(
                  r'(?m)^(\s*compileSdk(?:Version)?\s+).*$',
                  r'\g<1>36',
                  content,
                  count=1
              )

          if count != 1:
              raise SystemExit("ERROR: Could not configure app compileSdk")

          if (
              "isCoreLibraryDesugaringEnabled" not in content
              and "coreLibraryDesugaringEnabled" not in content
          ):
              replacement = (
                  "compileOptions {\n"
                  + (
                      "        isCoreLibraryDesugaringEnabled = true"
                      if is_kts
                      else "        coreLibraryDesugaringEnabled true"
                  )
              )

              content, count = re.subn(
                  r'compileOptions\s*\{',
                  lambda m: replacement,
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("ERROR: compileOptions block not found")

          if "desugar_jdk_libs" not in content:
              match = re.search(r'dependencies\s*\{', content)

              if is_kts:
                  dependency = (
                      '\n    coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  )
              else:
                  dependency = (
                      '\n    coreLibraryDesugaring '
                      '"com.android.tools:desugar_jdk_libs:2.1.4"\n'
                  )

              if match:
                  pos = match.end()
                  content = content[:pos] + dependency + content[pos:]
              else:
                  content += '\n\ndependencies {' + dependency + '}\n'

          gradle.write_text(content)
          print("App compileSdk 36 and desugaring configured.")
          PY

      - name: Configure Android notification manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="আমার হিসাব"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("ERROR: Could not set app display name")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          for permission in permissions:
              if f'android:name="{permission}"' not in content:
                  tag = (
                      f'    <uses-permission '
                      f'android:name="{permission}" />\n'
                  )
                  content = content.replace(
                      '<application',
                      tag + '\n    <application',
                      1
                  )

          receiver = """
                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                      android:exported="false" />

                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          """

          if "ScheduledNotificationReceiver" not in content:
              content = content.replace(
                  "</application>",
                  receiver + "\n    </application>",
                  1
              )

          manifest.write_text(content)
          print("Notification manifest configured.")
          PY

      - name: Enable AndroidX
        run: |
          touch android/gradle.properties

          grep -q '^android.useAndroidX=true$' android/gradle.properties \
            || echo 'android.useAndroidX=true' >> android/gradle.properties

          grep -q '^android.enableJetifier=true$' android/gradle.properties \
            || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Configure launcher icon
        run: |
          if [ -f icon.png ]; then
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#0F5132"
            adaptive_icon_foreground: "icon.png"
          EOF

            dart run flutter_launcher_icons \
              -f flutter_launcher_icons.yaml
          else
            echo "WARNING: icon.png not found; default icon will be used."
          fi

      - name: Clean and resolve dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Fix gallery_saver_plus compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          files = list(
              cache.glob("gallery_saver_plus-*/android/build.gradle")
          ) + list(
              cache.glob("gallery_saver_plus-*/android/build.gradle.kts")
          )

          if not files:
              raise SystemExit(
                  "ERROR: gallery_saver_plus Android Gradle file not found"
              )

          for gradle in files:
              content = gradle.read_text()

              pattern = (
                  r'(?m)^(\s*compileSdk(?:Version)?\s*'
                  r'(?:=\s*)?).*$'
              )

              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + "36",
                  content
              )

              if count == 0:
                  raise SystemExit(
                      f"ERROR: compileSdk setting not found in {gradle}"
                  )

              gradle.write_text(updated)

              print(f"Updated compileSdk to 36: {gradle}")

              for line in updated.splitlines():
                  if re.search(r'\bcompileSdk(?:Version)?\b', line):
                      print(line.strip())
          PY

      - name: Verify Gradle version
        run: |
          cd android
          ./gradlew --version
          cd ..

      - name: Verify File Picker installation
        run: |
          flutter pub deps

          find "$HOME/.pub-cache" \
            -path "*/file_picker-11.0.3/android/src/main/*" \
            -type f \
            \( -name "FilePickerPlugin.kt" -o -name "FilePickerPlugin.java" \) \
            -print

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
