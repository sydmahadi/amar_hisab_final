
name: amar_hisab
description: "আমার হিসাব - সহজে আপনার হিসাব রাখুন"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database and settings
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Charts and reports
  fl_chart: ^1.1.1
  pdf: ^3.11.3
  printing: ^5.14.2
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  image: 4.10.0
  intl: ^0.20.2

  # Sharing and gallery
  share_plus: ^12.0.2
  gallery_saver_plus: ^3.2.8

  # File selection and security
  file_picker: 11.0.3
  crypto: ^3.0.6

  # Notifications and background tasks
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  workmanager: ^0.10.0

  # Existing Google integration dependencies
  google_sign_in: ^7.2.0
  googleapis: ^14.0.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
